[pytest]
# 只在这些目录里找用例
testpaths = tests

# 默认参数：
#   -v                  显示每条用例的名字
#   --html=...          生成 HTML 测试报告
#   --self-contained-html  报告打成单个文件，方便发给别人看
addopts =
    -v
    --html=reports/report.html
    --self-contained-html

# 用例文件的命名规则
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 让 pytest 原样输出中文，不要转义成 \uXXXX
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = True
